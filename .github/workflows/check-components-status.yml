name: Check DTK Components Status

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check_status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check components status
        id: status_check
        run: |
          echo "# DTK Components Status Report" >> status_report.md
          echo "" >> status_report.md
          echo "Generated on: $(date -u)" >> status_report.md
          echo "" >> status_report.md
          echo "| Component | Current Submodule | Latest Tag | Status | Last Release |" >> status_report.md
          echo "|-----------|-------------------|------------|--------|--------------|" >> status_report.md
          
          # Define all DTK components
          COMPONENTS="dtkcommon dtkcore dtkgui dtkwidget dtkdeclarative qt5integration qt5platform-plugins"
          
          ALL_UP_TO_DATE=true
          
          for component in $COMPONENTS; do
            echo "🔍 Checking $component..."
            
            if [[ -d "$component" ]]; then
              cd "$component"
              
              # Get current submodule commit
              CURRENT_COMMIT=$(git rev-parse HEAD)
              CURRENT_SHORT=$(git rev-parse --short HEAD)
              
              # Fetch tags and get latest
              git fetch --tags origin 2>/dev/null || true
              LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
              
              if [[ -n "$LATEST_TAG" ]]; then
                LATEST_TAG_COMMIT=$(git rev-parse "$LATEST_TAG" 2>/dev/null || echo "unknown")
                
                # Check if current commit matches latest tag
                if [[ "$CURRENT_COMMIT" == "$LATEST_TAG_COMMIT" ]]; then
                  STATUS="✅ Up to date"
                else
                  STATUS="⚠️ Behind"
                  ALL_UP_TO_DATE=false
                fi
              else
                LATEST_TAG="No tags"
                STATUS="❓ No tags found"
                ALL_UP_TO_DATE=false
              fi
              
              # Get last release date from GitHub API
              REPO="linuxdeepin/$component"
              LAST_RELEASE_INFO=$(gh api repos/"$REPO"/releases/latest --jq '.published_at // "No releases"' 2>/dev/null || echo "API Error")
              
              if [[ "$LAST_RELEASE_INFO" != "No releases" && "$LAST_RELEASE_INFO" != "API Error" ]]; then
                LAST_RELEASE_DATE=$(date -d "$LAST_RELEASE_INFO" "+%Y-%m-%d" 2>/dev/null || echo "$LAST_RELEASE_INFO")
              else
                LAST_RELEASE_DATE="$LAST_RELEASE_INFO"
              fi
              
              # Add to table
              echo "| [$component](https://github.com/$REPO) | $CURRENT_SHORT | $LATEST_TAG | $STATUS | $LAST_RELEASE_DATE |" >> ../status_report.md
              
              cd ..
            else
              echo "| $component | ❌ Missing | - | ❌ Submodule not found | - |" >> status_report.md
              ALL_UP_TO_DATE=false
            fi
          done
          
          echo "" >> status_report.md
          
          if [[ "$ALL_UP_TO_DATE" == "true" ]]; then
            echo "## ✅ Overall Status: All components are up to date!" >> status_report.md
          else
            echo "## ⚠️ Overall Status: Some components need attention" >> status_report.md
            echo "" >> status_report.md
            echo "### Recommended Actions:" >> status_report.md
            echo "- For components behind latest tags: Run the 'Update Submodules' workflow" >> status_report.md
            echo "- For components without recent releases: Consider running the 'Release All Components' workflow" >> status_report.md
          fi
          
          echo "" >> status_report.md
          echo "---" >> status_report.md
          echo "*Report generated by DTK Components Status workflow*" >> status_report.md
          
          # Set output for summary
          echo "all_up_to_date=$ALL_UP_TO_DATE" >> $GITHUB_OUTPUT

      - name: Display status in job summary
        run: |
          cat status_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload status report
        uses: actions/upload-artifact@v4
        with:
          name: dtk-components-status-report
          path: status_report.md
          retention-days: 30

      - name: Check if action needed
        run: |
          if [[ "${{ steps.status_check.outputs.all_up_to_date }}" != "true" ]]; then
            echo "⚠️ Some components are not up to date. Consider running maintenance workflows."
            echo ""
            echo "Available workflows:"
            echo "- 'Release All Components' - to trigger new releases"
            echo "- 'Update Submodules' - to update submodule references to latest tags"
          else
            echo "✅ All components are up to date!"
          fi