name: Update Submodules to Latest Tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test mode)'
        required: false
        default: false
        type: boolean
      selected_components:
        description: 'Selected components (comma-separated, leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  update_submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to latest tags
        id: update
        run: |
          # Define all DTK components
          ALL_COMPONENTS="dtkcommon dtkcore dtkgui dtkwidget dtkdeclarative qt5integration qt5platform-plugins"
          
          # Use selected components if provided, otherwise use all
          if [[ -n "${{ github.event.inputs.selected_components }}" ]]; then
            COMPONENTS=$(echo "${{ github.event.inputs.selected_components }}" | tr ',' ' ')
          else
            COMPONENTS="$ALL_COMPONENTS"
          fi
          
          echo "Updating components: $COMPONENTS"
          
          UPDATED_COMPONENTS=""
          HAS_CHANGES=false
          
          for component in $COMPONENTS; do
            if [[ -d "$component" ]]; then
              echo "🔄 Processing $component..."
              
              cd "$component"
              
              # Fetch all tags
              git fetch --tags origin
              
              # Get the latest tag
              LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
              CURRENT_REF=$(git rev-parse HEAD)
              
              if [[ -n "$LATEST_TAG" ]]; then
                LATEST_TAG_REF=$(git rev-parse "$LATEST_TAG")
                
                echo "  Current: $CURRENT_REF"
                echo "  Latest tag: $LATEST_TAG ($LATEST_TAG_REF)"
                
                if [[ "$CURRENT_REF" != "$LATEST_TAG_REF" ]]; then
                  echo "  ⬆️  Updating to $LATEST_TAG"
                  git checkout "$LATEST_TAG"
                  UPDATED_COMPONENTS="$UPDATED_COMPONENTS $component($LATEST_TAG)"
                  HAS_CHANGES=true
                else
                  echo "  ✅ Already at latest tag $LATEST_TAG"
                fi
              else
                echo "  ⚠️  No tags found in $component"
              fi
              
              cd ..
            else
              echo "❌ Component directory $component not found"
            fi
          done
          
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "updated_components=$UPDATED_COMPONENTS" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.update.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git add -A
          git commit -m "chore: update submodules to latest tags

          Updated components:${{ steps.update.outputs.updated_components }}
          
          Auto-generated by update-submodules workflow"
          
          git push origin ${{ github.ref_name }}

      - name: Generate summary
        run: |
          echo "# Submodule Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "🧪 **This was a dry run - no changes were committed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ steps.update.outputs.has_changes }}" == "true" ]]; then
            echo "✅ **Updated components:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.update.outputs.updated_components }}" | tr ' ' '\n' | while read component; do
              if [[ -n "$component" ]]; then
                echo "- $component" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "ℹ️ **No updates needed** - all submodules are already at their latest tags" >> $GITHUB_STEP_SUMMARY
          fi