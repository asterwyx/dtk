      - name: Call build-distribution workflow
        uses: linuxdeepin/.github/.github/workflows/build-distribution.yml@master
        secrets: inherit

  create-summary:
    needs: [update-versions, auto-tag-dtkcommon, auto-tag-dtkcore, auto-tag-dtkgui, auto-tag-dtkwidget, auto-tag-dtkdeclarative, auto-tag-qt5integration, auto-tag-qt5platform-plugins, build-distribution-dtkcommon, build-distribution-dtkcore, build-distribution-dtkgui, build-distribution-dtkwidget, build-distribution-dtkdeclarative, build-distribution-qt5integration, build-distribution-qt5platform-plugins]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create release summary
        run: |
          echo "## DTK Batch Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** ${{ env.RELEASE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Notes:** ${{ env.RELEASE_NOTES }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Components Processed:**" >> $GITHUB_STEP_SUMMARY
          echo "- dtkcommon" >> $GITHUB_STEP_SUMMARY
          echo "- dtkcore" >> $GITHUB_STEP_SUMMARY
          echo "- dtkgui" >> $GITHUB_STEP_SUMMARY
          echo "- dtkwidget" >> $GITHUB_STEP_SUMMARY
          echo "- dtkdeclarative" >> $GITHUB_STEP_SUMMARY
          echo "- qt5integration" >> $GITHUB_STEP_SUMMARY
          echo "- qt5platform-plugins" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflows Triggered:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version updates in debian/changelog" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-tag workflows for each component" >> $GITHUB_STEP_SUMMARY
          echo "- Build-distribution workflows for each component" >> $GITHUB_STEP_SUMMARY