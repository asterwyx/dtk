name: Batch Release All DTK Components

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 5.7.10)'
        required: true
        type: string
      release_notes:
        description: 'Release notes for all components'
        required: false
        type: string
        default: 'Batch release all DTK components'

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}
  RELEASE_NOTES: ${{ github.event.inputs.release_notes }}

jobs:
  update-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [dtkcommon, dtkcore, dtkgui, dtkwidget, dtkdeclarative, qt5integration, qt5platform-plugins]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in changelog
        run: |
          cd ${{ matrix.component }}
          
          # Check if debian/changelog exists
          if [ ! -f "debian/changelog" ]; then
            echo "No debian/changelog found in ${{ matrix.component }}, skipping"
            exit 0
          fi
          
          # Get current version
          current_version=$(dpkg-parsechangelog -S Version)
          echo "Current version: $current_version"
          
          # Update changelog with new version
          dch -v "${{ env.RELEASE_VERSION }}" "${{ env.RELEASE_NOTES }}"
          
          # Commit the version update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debian/changelog
          git commit -m "chore: bump version to ${{ env.RELEASE_VERSION }}"
          git push origin HEAD:${{ github.ref_name }}

  auto-tag-dtkcommon:
    needs: update-versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dtkcommon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Call auto-tag workflow
        uses: linuxdeepin/.github/.github/workflows/auto-tag.yml@master
        secrets: inherit

  auto-tag-dtkcore:
    needs: update-versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dtkcore
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Call auto-tag workflow
        uses: linuxdeepin/.github/.github/workflows/auto-tag.yml@master
        secrets: inherit

  auto-tag-dtkgui:
    needs: update-versions
    runs-on: ubuntu-latest
